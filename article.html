<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخبر | ذكاء السعودية</title><style>body{margin:0;background:#11160f;color:#edf1e6;font-family:Tahoma,Arial;line-height:1.8}.wrap{max-width:780px;margin:8vh auto;padding:20px}.card{background:#1a2117;border:1px solid #303b2b;border-radius:16px;padding:28px}.muted{color:#a6b09b}a,button{color:#edf1e6;background:#293522;border:1px solid #52633d;border-radius:9px;padding:10px 15px;text-decoration:none;display:inline-block;margin:8px 4px;cursor:pointer}.primary{background:#a5b77a;color:#172012}</style></head><body><main class="wrap"><p><a href="index.html">ذكاء السعودية · Saudi AI</a></p><article class="card"><p class="muted">صفحة الخبر</p><h1 id="title">الخبر</h1><p class="muted" id="meta"></p><p id="description"></p><p><a class="primary" id="original" target="_blank" rel="noopener">قراءة الخبر لدى الناشر الأصلي ↗</a><button id="share">مشاركة الخبر</button><a href="index.html">العودة للأخبار</a></p><p class="muted">المحتوى الكامل وحقوق النشر لدى الناشر الأصلي.</p></article></main><script>const p=new URLSearchParams(location.search);const title=p.get("title")||"الخبر";const url=p.get("url")||"";document.title=title+" | ذكاء السعودية";document.getElementById("title").textContent=title;document.getElementById("meta").textContent=(p.get("source")||"الناشر الأصلي")+" · "+(p.get("date")||"");document.getElementById("description").textContent=p.get("description")||"";document.getElementById("original").href=url;document.getElementById("share").onclick=()=>{const link=location.href;if(navigator.share){navigator.share({title:title,url:link})}else{prompt("انسخ رابط الخبر",link)}};</script></body></html>
