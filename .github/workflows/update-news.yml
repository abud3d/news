name: Update cached news
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "article.html"
      - "scripts/**"
      - ".github/workflows/update-news.yml"
permissions:
  contents: write
concurrency:
  group: cached-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Bump approximate site version for source updates
        if: github.event_name == 'push'
        run: |
          subject="$(git log -1 --format=%s)"
          if echo "$subject" | grep -q '\[skip ci\]'; then
            echo "Skipping version bump for an automated cache commit."
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            if echo "$changed" | grep -Eq '^(index\.html|article\.html|scripts/.*\.py|\.github/workflows/update-news\.yml)$'; then
              python scripts/bump_version.py
            fi
          fi
      - name: Compile update scripts
        run: python -m py_compile scripts/update_news.py scripts/update_offers.py
      - name: Fetch feeds and preserve previous data on failures
        run: python scripts/update_news.py
      - name: Validate news cache before commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/news.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(data.get("categories"), dict) and len(data["categories"]) >= 5, "categories missing"
          assert data.get("updated_at"), "updated_at missing"
          assert isinstance(data.get("health"), dict), "freshness report missing"
          assert "latest_news_at" in data, "latest news timestamp missing"
          total = 0
          for name, section in data["categories"].items():
              assert isinstance(section.get("items", []), list), f"invalid items: {name}"
              for item in section.get("items", []):
                  assert item.get("title") and item.get("url"), f"invalid article: {name}"
                  total += 1
          assert total > 0, "all categories are empty"
          print(f"VALID cache: {len(data['categories'])} categories, {total} article entries; latest={data.get('latest_news_at')}")
          print(f"STALE categories: {len(data['health'].get('stale_categories', []))}")
          PY
      - name: Fetch active store flyers from SnapFlyer
        continue-on-error: true
        run: python scripts/update_offers.py
      - name: Check generated changes
        run: git diff --check
      - name: Commit updated cache and version
        run: |
          if git diff --quiet -- data/news.json data/offers.json index.html; then
            echo "No cache or version changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/offers.json index.html
          git commit -m "[skip ci] chore: refresh cached news and offers"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout latest committed site and cache
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated news site
        id: deployment
        uses: actions/deploy-pages@v4
