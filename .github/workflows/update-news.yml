name: Update cached news
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - "scripts/update_offers.py"
      - ".github/workflows/update-news.yml"
permissions:
  contents: write
concurrency:
  group: cached-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch feeds and preserve previous data on failures
        run: python scripts/update_news.py
      - name: Fetch active store flyers from SnapFlyer
        continue-on-error: true
        run: python scripts/update_offers.py
      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/news.json data/offers.json; then
            echo "No news cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/offers.json
          git commit -m "chore: refresh cached news and offers"
          git push
