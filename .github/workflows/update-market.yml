name: Save Saudi market snapshot after close
on:
  schedule:
    # Once after the Saudi market close, Sunday–Thursday (15:40 Riyadh).
    - cron: "40 12 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and save closing prices
        run: python scripts/update_market.py
      - name: Commit repository snapshot
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No market snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "[skip ci] chore: save end-of-day market prices"
          git pull --rebase origin main
          git push
