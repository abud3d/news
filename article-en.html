<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | Saudi AI</title><style>body{margin:0;background:#11160f;color:#edf1e6;font-family:Tahoma,Arial;line-height:1.8}.wrap{max-width:780px;margin:8vh auto;padding:20px}.card{background:#1a2117;border:1px solid #303b2b;border-radius:16px;padding:28px}.muted{color:#a6b09b}a,button{color:#edf1e6;background:#293522;border:1px solid #52633d;border-radius:9px;padding:10px 15px;text-decoration:none;display:inline-block;margin:8px 4px;cursor:pointer}.primary{background:#a5b77a;color:#172012}</style></head><body><main class="wrap"><p><a href="article.html" lang="ar" dir="rtl">العربية</a> <a href="index-en.html">Saudi AI · News Briefing</a></p><article class="card"><p class="muted">Article page</p><h1 id="title">Article</h1><p class="muted" id="meta"></p><p id="description"></p><p><a class="primary" id="original" target="_blank" rel="noopener">Read more at the source ↗</a><button id="share">Share article</button><a href="index-en.html">Back to news</a></p><p class="muted">Full content and copyrights belong to the original publisher.</p></article></main><script>const p=new URLSearchParams(location.search);const title=p.get("title")||"Article";const url=p.get("url")||"";document.title=title+" | ذكاء السعودية";document.getElementById("title").textContent=title;document.getElementById("meta").textContent=(p.get("source")||"Original publisher")+" · "+(p.get("date")||"");document.getElementById("description").textContent=p.get("description")||"";document.getElementById("original").href=url;document.getElementById("share").onclick=()=>{const link=location.href;if(navigator.share){navigator.share({title:title,url:link})}else{prompt("Copy the article link",link)}};</script></body></html>
